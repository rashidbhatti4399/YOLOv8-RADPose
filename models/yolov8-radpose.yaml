# Ultralytics YOLOv8n-pose with ViT block after head C2f layer (late-stage attention)
# Updated for custom Transformer after head with DropPath

# Parameters
nc: 1  # number of classes
kpt_shape: [17, 3]  # 17 keypoints with (x, y, visibility)
scales:
  n: [0.33, 0.25, 1024]  # YOLOv8n-RADPose
  s: [0.33, 0.50, 1024]  # YOLOv8s-RADPose summary
  m: [0.67, 0.75, 768]   # YOLOv8m-RADPose summary
  l: [1.00, 1.00, 512]   # YOLOv8l-RADPose summary
  x: [1.00, 1.25, 512]   # YOLOv8x-RADPose summary


# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4
  - [-1, 3, C2f, [128, True]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8
  - [-1, 6, C2f, [256, True]]         # 4
  - [-1, 1, Conv, [512, 3, 2]]        # 5-P4/16
  - [-1, 6, C2f, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]       # 7-P5/32
  - [-1, 3, C2f, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]          # 9

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11
  - [-1, 3, C2f, [512]]                          # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14
  - [-1, 3, C2f, [256]]                          # 15

  - [-1, 1, Conv, [256, 3, 2]]                   # 16
  - [[-1, 12], 1, Concat, [1]]                   # 17
  - [-1, 3, C2f, [512]]                          # 18

  - [-1, 1, Conv, [512, 3, 2]]                   # 19
  - [[-1, 9], 1, Concat, [1]]                    # 20
  - [-1, 3, C2f, [1024]]                         # 21  <--- output before ViT

  # ViT Block (Late-stage feature refinement)
  - [-1, 1, RADPoseBlock, [256, 8]]             # 22  <--- ViTBlock(embed_dim, heads, droppath)

  # Pose head
  - [[15, 18, 22], 1, Pose, [nc, kpt_shape]]     # 23
